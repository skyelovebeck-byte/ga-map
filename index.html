/* U.S. House — 2026 Georgia delegation */
const US_HOUSE = {
1:["Earl Carter","R"],2:["Sanford Bishop","D"],3:["Brian Jack","R"],
4:["Hank Johnson","D"],5:["Nikema Williams","D"],6:["Lucy McBath","D"],

/* ============================================================
   MAP
   ============================================================ */
const map = L.map('map').setView([32.9,-83.4], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; OpenStreetMap contributors', maxZoom:19}).addTo(map);

const bubbles = L.layerGroup().addTo(map);
let members = {}, meta = {}, bills = [];

const rad = n => Math.max(7, 5 + Math.sqrt(n) * 5);
const col = n => n >= 5 ? '#08519c' : n >= 3 ? '#3182bd' : n >= 2 ? '#6baed6' : '#bdd7e7';

function setStatus(msg, warn){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = warn ? 'warn' : '';
}

/* ---- CSV parsing ---- */
function parseCSV(t){
  const rows = [[]]; let f = '', q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){
      if(c === '"' && t[i+1] === '"'){ f += '"'; i++; }
      else if(c === '"') q = false;
      else f += c;
    }
    else if(c === '"') q = true;
    else if(c === ','){ rows[rows.length-1].push(f); f = ''; }
    else if(c === '\n'){ rows[rows.length-1].push(f); f = ''; rows.push([]); }
    else if(c !== '\r') f += c;
  }
  rows[rows.length-1].push(f);
  return rows.filter(r => r.some(c => c.trim()));
}

async function loadMembers(){
  for(const src of SOURCES){
    try {
      const res = await fetch(src + '&t=' + Date.now());
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const rows = parseCSV(await res.text());
      const head = rows.shift().map(h => h.trim().toLowerCase());
      const iZ = head.indexOf('zip'), iM = head.indexOf('members'), iA = head.indexOf('area');
      if(iZ < 0 || iM < 0) throw new Error('CSV needs "zip" and "members" columns');

      members = {}; meta = {};
      let skipped = 0, nogeo = 0;
      rows.forEach(r => {
        const z = (r[iZ] || '').trim().padStart(5,'0');
        const n = parseInt((r[iM] || '').trim(), 10);
        if(!/^\d{5}$/.test(z) || !n){ if((r[iZ]||'').trim()) skipped++; return; }
        members[z] = (members[z] || 0) + n;
        meta[z] = { area: iA >= 0 ? (r[iA] || '').trim() : '' };
        if(!Z[z]) nogeo++;
      });

      const total = Object.values(members).reduce((a,b) => a+b, 0);
      setStatus(`${total} members · ${Object.keys(members).length} ZIPs · updated `
        + new Date().toLocaleTimeString()
        + (skipped ? ` · ${skipped} row(s) skipped` : '')
        + (nogeo ? ` · ${nogeo} ZIP(s) not mapped` : ''), nogeo > 0);
      draw();
      return;
    } catch(e){ console.warn('Source failed:', src, e.message); }
  }
  setStatus('Could not load roster CSV. Check data/members_by_zip.csv exists.', true);
}

function draw(){
  bubbles.clearLayers();
  Object.entries(members).forEach(([z,n]) => {
    const g = Z[z];
    if(!g) return;
    const area = (meta[z] && meta[z].area) || g[2];
    L.circleMarker([g[0], g[1]], {
      radius: rad(n), fillColor: col(n), color:'#fff', weight:1.5, fillOpacity:.85
    })
    .bindTooltip(`<b>${z}</b> — ${area}<br>${n} member${n>1?'s':''} · CD ${g[3]}`)
    .on('click', () => lookup(z))
    .addTo(bubbles);
  });
}

/* ---- Bills ---- */
async function loadBills(){
  try {
    const r = await fetch('data/tracked_bills.json?t=' + Date.now());
    if(r.ok) bills = await r.json();
  } catch(e){ console.warn('No bill file:', e.message); }
}

function billBlock(name, chamber){
  const list = bills.filter(b => b.chamber === chamber);
  if(!list.length) return '<p style="font-size:12px;color:#999">No tracked bills yet.</p>';
  const last = name.split(' ').pop();
  return list.map(b => {
    const v = (b.votes && (b.votes[last] || b.votes[name])) || null;
    const cls = v === 'yes' ? 'yes' : v === 'no' ? 'no' : 'na';
    return `<div class="bill ${cls}">
      <b>${b.bill}</b> — ${b.title}<br>
      <span style="color:#666">${b.status}</span>
      ${b.position ? ` · <i>Our position: ${b.position}</i>` : ''}<br>
      Vote: <b>${v ? v.toUpperCase() : 'not recorded'}</b>
      ${b.url ? ` · <a href="${b.url}" target="_blank" rel="noopener">bill text</a>` : ''}
    </div>`;
  }).join('');
}

/* ---- Lookup ---- */
async function lookup(zip){
  const out = document.getElementById('results');
  const g = Z[zip];
  const n = members[zip] || 0;
  const area = (meta[zip] && meta[zip].area) || (g ? g[2] : '');

  out.innerHTML = `<div class="sect">ZIP ${zip}${area ? ' · ' + area : ''}</div>
    <p style="font-size:13px;margin:4px 0 0">${n} member${n===1?'':'s'} in our roster</p>
    <p style="color:#666;font-size:13px">Loading representatives…</p>`;

  let html = `<div class="sect">ZIP ${zip}${area ? ' · ' + area : ''}</div>
    <p style="font-size:13px;margin:4px 0 12px">${n} member${n===1?'':'s'} in our roster</p>`;

  /* U.S. House — embedded table */
  if(g && US_HOUSE[g[3]]){
    const [nm, pty] = US_HOUSE[g[3]];
    html += `<div class="sect">U.S. House</div>
      <div class="leg">
        <h3>${nm}<span class="tag ${pty}">${pty}</span><span class="tag fed">CD ${g[3]}</span></h3>
        <p class="meta">Georgia's ${g[3]}${g[3]===1?'st':g[3]===2?'nd':g[3]===3?'rd':'th'} Congressional District</p>
        ${billBlock(nm, 'federal')}
      </div>`;
  }

  /* State legislators — live Open States lookup */
  html += '<div class="sect">Georgia General Assembly</div>';
  if(!g){
    html += '<p style="font-size:12px;color:#999">ZIP not in coordinate table.</p>';
  } else if(OS_KEY.startsWith('PASTE')){
    html += '<p style="font-size:12px;color:#c0392b">Open States API key not set — '
          + 'add it at the top of index.html to enable live legislator lookup.</p>';
  } else {
    try {
      const res = await fetch(`https://v3.openstates.org/people.geo?lat=${g[0]}&lng=${g[1]}`
        + `&apikey=${OS_KEY}`);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(!data.results.length) html += '<p style="font-size:12px;color:#999">No match returned.</p>';
      data.results.forEach(p => {
        const ch = p.current_role.org_classification === 'upper' ? 'Senate' : 'House';
        const pty = (p.party || '').charAt(0);
        html += `<div class="leg">
          <h3>${p.name}<span class="tag ${pty}">${pty}</span></h3>
          <p class="meta">State ${ch} · District ${p.current_role.district}
            ${p.email ? ' · <a href="mailto:' + p.email + '">' + p.email + '</a>' : ''}</p>
          ${billBlock(p.name, 'state')}
        </div>`;
      });
    } catch(e){
      html += `<p style="font-size:12px;color:#c0392b">Legislator lookup failed: ${e.message}</p>`;
    }
  }

  html += '<p class="note">District assignments are based on ZIP centroids. '
        + 'ZIP codes often span multiple districts — enter a full address on the '
        + 'Georgia General Assembly site to confirm.</p>';
  out.innerHTML = html;
}

document.getElementById('go').onclick = () => {
  const v = document.getElementById('lookup').value.trim();
  if(/^\d{5}$/.test(v)) lookup(v);
  else setStatus('Enter a valid 5-digit ZIP code.', true);
};
document.getElementById('lookup').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('go').click();
});

loadBills().then(loadMembers);
setInterval(loadMembers, 10 * 60 * 1000);
</script>
